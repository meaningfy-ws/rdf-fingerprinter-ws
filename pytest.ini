[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*

# No --cov here: coverage flags live only in the Makefile's `test` target, so plain `pytest` stays fast.
addopts =
    -v
    --strict-markers
    --tb=short

# Connexion 3 imports jsonschema's deprecated RefResolver and Starlette's httpx test client;
# neither is ours to fix; nor is Celery 5.7's Redis backend calling a redis-py method deprecated there,
# nor billiard forking the e2e worker's child from the multi-threaded test process.
# Anything else that shows is ours.
filterwarnings =
    ignore::DeprecationWarning:connexion.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:Call to deprecated setex:DeprecationWarning
    ignore:This process .* is multi-threaded, use of fork:DeprecationWarning:billiard.*

log_format = %(asctime)s %(levelname)-8s %(name)s %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S

# Markers are applied by tests/conftest.py (pytest_collection_modifyitems, by path);
# do NOT add per-file pytestmark.
markers =
    unit: fast, no I/O — domain/service/adapter layer tests with fakes
    feature: BDD feature tests (pytest-bdd step definitions)
    integration: requires a running datastore/service (containers)
    e2e: end-to-end tests against the real stack (containers)
