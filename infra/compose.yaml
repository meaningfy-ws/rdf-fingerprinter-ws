# The whole stack, from the images built out of this repository (no source mounts).
# Use `make up` (it passes infra/.env); see infra/.env.example.
#
# Egress (SECURITY.md): the worker fetches any SPARQL endpoint URL a client submits, so it can reach
# whatever its network reaches. Restrict its outgoing traffic at the network level (firewall, egress
# proxy, a Docker network with only the allowed routes); compose cannot do it alone.

name: rdf-fingerprinter-ws

x-service-env: &service-env
  # The in-network ports of the third-party images; the .env ports are the ones published on the host.
  RDF_FINGERPRINTER_FUSEKI_PORT: "3030"
  RDF_FINGERPRINTER_REDIS_PORT: "6379"
  RDF_FINGERPRINTER_PLANTUML_PORT: "8080"

services:
  fingerprinter-api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    image: ghcr.io/meaningfy-ws/rdf-fingerprinter-ws-api:local
    env_file: .env
    environment: *service-env
    ports:
      - ${RDF_FINGERPRINTER_API_PORT}:${RDF_FINGERPRINTER_API_PORT}
    volumes:
      - reports:/app/reports
      - uploads:/app/db
    depends_on:
      - redis
      - fuseki
      - plantuml

  fingerprinter-ui:
    build:
      context: ..
      dockerfile: infra/ui/Dockerfile
    image: ghcr.io/meaningfy-ws/rdf-fingerprinter-ws-ui:local
    env_file: .env
    environment: *service-env
    ports:
      - ${RDF_FINGERPRINTER_UI_PORT}:${RDF_FINGERPRINTER_UI_PORT}
    depends_on:
      - fingerprinter-api

  fingerprinter-worker:
    build:
      context: ..
      dockerfile: infra/worker/Dockerfile
    image: ghcr.io/meaningfy-ws/rdf-fingerprinter-ws-worker:local
    env_file: .env
    environment: *service-env
    volumes:
      - reports:/app/reports
      - uploads:/app/db
    depends_on:
      - redis
      - fuseki
      - plantuml

  fingerprinter-flower:
    build:
      context: ..
      dockerfile: infra/worker/Dockerfile
    image: ghcr.io/meaningfy-ws/rdf-fingerprinter-ws-worker:local
    command:
      - sh
      - -c
      - exec celery -A fingerprinter.bootstrap:celery_app flower --port=$${RDF_FINGERPRINTER_FLOWER_PORT}
    env_file: .env
    environment: *service-env
    ports:
      - 127.0.0.1:${RDF_FINGERPRINTER_FLOWER_PORT}:${RDF_FINGERPRINTER_FLOWER_PORT}
    depends_on:
      - fingerprinter-worker

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${RDF_FINGERPRINTER_REDIS_PORT}:6379

  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: ${RDF_FINGERPRINTER_FUSEKI_PASSWORD}
      JVM_ARGS: ${RDF_FINGERPRINTER_FUSEKI_JVM_ARGS}
    ports:
      - 127.0.0.1:${RDF_FINGERPRINTER_FUSEKI_PORT}:3030
    volumes:
      - fuseki:/fuseki

  plantuml:
    # image, size limit and security profile: kept equal to tests/containers.py
    image: plantuml/plantuml-server:jetty-v1.2024.7
    environment:
      - PLANTUML_LIMIT_SIZE=16384
      - PLANTUML_SECURITY_PROFILE=SANDBOX
    ports:
      - 127.0.0.1:${RDF_FINGERPRINTER_PLANTUML_PORT}:8080

volumes:
  reports:
  uploads:
  fuseki:
