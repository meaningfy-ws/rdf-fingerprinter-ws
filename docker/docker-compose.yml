version: "3.7"

services:
  fingerprinter-api:
    container_name: fingerprinter-api
    command: gunicorn --timeout ${RDF_FINGERPRINTER_GUNICORN_TIMEOUT-1200} --workers ${RDF_FINGERPRINTER_GUNICORN_API_WORKERS-2} --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:${RDF_FINGERPRINTER_API_PORT} --reload --log-level=debug 'fingerprinter.bootstrap:api_app()' --log-file ${RDF_FINGERPRINTER_API_LOGS} --log-level ${RDF_FINGERPRINTER_LOG_LEVEL}
    build:
      context: ..
      dockerfile: ./docker/api/Dockerfile
    volumes:
      - ..:/usr/src/app
    ports:
      - ${RDF_FINGERPRINTER_API_PORT}:${RDF_FINGERPRINTER_API_PORT}
    env_file: .env
    networks:
      - mydefault

  fingerprinter-ui:
    container_name: fingerprinter-ui
    build:
      context: ..
      dockerfile: ./docker/ui/Dockerfile
    volumes:
      - ..:/usr/src/app
    ports:
      - ${RDF_FINGERPRINTER_UI_PORT}:${RDF_FINGERPRINTER_UI_PORT}
    env_file: .env
    depends_on:
      - "fingerprinter-api"
    networks:
      - mydefault

  fingerprinter-celery-worker:
    container_name: fingerprinter-celery-worker
    build:
      context: ..
      dockerfile: ./docker/api/Dockerfile
    command: celery -A fingerprinter.bootstrap:celery_app worker --loglevel ${RDF_FINGERPRINTER_LOG_LEVEL} --logfile ${RDF_FINGERPRINTER_CELERY_LOGS}
    volumes:
      - ..:/usr/src/app
    env_file: .env
    networks:
      - mydefault
    depends_on:
      - redis
      - plantuml

  redis:
    image: redis:6-alpine
    ports:
      - ${RDF_FINGERPRINTER_REDIS_PORT}:${RDF_FINGERPRINTER_REDIS_PORT}
    networks:
      - mydefault

  plantuml:
    container_name: plantuml
    image: plantuml/plantuml-server:jetty-v1.2024.7
    environment:
      - PLANTUML_LIMIT_SIZE=16384
    networks:
      - mydefault

  fingerprinter-dashboard:
    build:
      context: ..
      dockerfile: ./docker/api/Dockerfile
    command: celery -A fingerprinter.bootstrap:celery_app --broker=${RDF_FINGERPRINTER_REDIS_LOCATION}:${RDF_FINGERPRINTER_REDIS_PORT} flower --port=${RDF_FINGERPRINTER_FLOWER_PORT}
    env_file: .env
    ports:
      - ${RDF_FINGERPRINTER_FLOWER_PORT}:${RDF_FINGERPRINTER_FLOWER_PORT}
    depends_on:
      - fingerprinter-celery-worker
    networks:
      - mydefault

  fuseki:
    container_name: fuseki
    image: stain/jena-fuseki:4.0.0
    volumes:
      - ${PWD}/${RDF_FINGERPRINTER_FUSEKI_DATA_FOLDER}/fuseki:/fuseki
    env_file: .env
    environment:
      - ADMIN_PASSWORD=${RDF_FINGERPRINTER_FUSEKI_ADMIN_PASSWORD}
      - JVM_ARGS=${RDF_FINGERPRINTER_FUSEKI_JVM_ARGS}
    ports:
      - ${RDF_FINGERPRINTER_FUSEKI_PORT}:3030
    networks:
      - mydefault

networks:
  mydefault:
    name: globalnet
