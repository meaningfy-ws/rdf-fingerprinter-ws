# pre-commit hooks: Ruff on every commit. mypy and import-linter run in CI and via `make check-quality`.
# Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff pin in pyproject.toml [dependency-groups].lint
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
