# CI: every step calls a `make` target, so "green locally" means "green in CI".
# Runs on pushes to develop and on PRs into develop.
name: CI

on:
  push:
    branches: [develop]
    paths-ignore: ["docs/**", "*.md", "LICENSE", ".claude/**"]
  pull_request:
    branches: [develop]
    paths-ignore: ["docs/**", "*.md", "LICENSE", ".claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-all:
    name: Lint, typecheck, architecture, spec and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true

      # make check-spec runs the pinned OpenSpec CLI through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - run: make install
      - run: make check-all

  # Integration and e2e tests need Docker (Fuseki, Redis) and, for the UI journeys, Chromium.
  containers:
    name: Container tests (integration and e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true

      - run: make install
      - run: uv run playwright install --with-deps chromium
      - run: make test-containers

  # The compose file is valid and the three images build; nothing is pushed.
  images:
    name: Images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: make build-images
