# Docs workflow: the nav check, then the Antora build. Every step calls a `make` target.
name: docs

on:
  push:
    branches: [develop]
    paths: ["docs/**"]
  pull_request:
    branches: [develop]
    paths: ["docs/**"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: make check-docs
      - run: make install-antora
      - run: make build-docs
