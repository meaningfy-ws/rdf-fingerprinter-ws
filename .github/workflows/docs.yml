# Docs workflow: the nav check, then the Antora build. Every step calls a `make` target.
name: docs

on:
  push:
    branches: [develop]
    paths: ["docs/**"]
  pull_request:
    branches: [develop]
    paths: ["docs/**"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: make check-docs
      - run: make install-antora
      - run: make build-docs
