openapi: 3.0.1

info:
  title: Fingerprinting Service
  description: |
    This API provides the possibility to fingerprint an RDF file or SPARQL endpoint.

  contact:
    name: Eugeniu Costetchi
    url: http://costezki.ro
    email: costezki.eugen@gmail.com
  license:
    name: GNU General Public License Version 3 (GPLv3)
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 1.0.1

servers:
  - url: 'http://localhost:4020/'
    description: Default server

components:
  parameters:
    extensionParam:
      in: query
      name: report_type
      required: false
      schema:
        type: string
      description: The type of the report that will be returned

  schemas:
    EndpointFingerprinter:
      type: object
      description: Fingerprint a SPARQL endpoint
      properties:
        sparql_endpoint_url:
          type: string
          description: The endpoint to fingerprint
        graphs:
          type: array
          description: An optional list of named graphs to restrict the scope of the fingerprinting
          items:
            type: string
      required:
        - sparql_endpoint_url

    FileFingerprinter:
      type: object
      description: Fingerprint a file
      properties:
        data_file:
          type: string
          format: binary
          description: The file to be fingerprinted
      required:
        - data_file
    TaskStatus:
      type: object
      description: A description of a task status response.
      properties:
        task_id:
          type: string
          description: The task identifier.
        task_status:
          type: string
          description: The task status.
        task_result:
          type: string
          description: The task result.

paths:
  /fingerprint-sparql-endpoint:
    post:
      operationId: fingerprinter.entrypoints.api.handlers.fingerprint_sparql_endpoint
      description: Fingerprint a SPARQL endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointFingerprinter'
      responses:
        200:
          description: OK.
        5XX:
          description: Unexpected Error.
  /fingerprint-file:
    post:
      operationId: fingerprinter.entrypoints.api.handlers.fingerprint_file
      description: Fingerprint an RDF file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileFingerprinter'
      responses:
        200:
          description: OK.
        5XX:
          description: Unexpected Error.

  /reports:
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_fingerprintings
      description: Get all reports.
      responses:
        200:
          description: Fingerprinting reports successfully retrieved.
          content:
            application/json:
              schema:
                type: array
        5XX:
          description: Unexpected Error.
  /reports/{uid}:
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_fingerprinting_report
      description: Get a fingerprinting report.
      parameters:
        - in: query
          name: report_type
          required: false
          description: Report type
          schema:
            type: string
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Fingerprinting report successfully retrieved.
          content:
            text/html:
              schema:
                type: string
                format: binary
        404:
          description: Fingerprinting report not found.
        5XX:
          description: Unexpected Error.
    delete:
      operationId: fingerprinter.entrypoints.api.handlers.delete_fingerprinting
      description: Delete a fingerprinting report.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Fingerprinting report successfully deleted.
        404:
          description: Fingerprinting doesn't exist.
        5XX:
          description: Unexpected Error.
  /remove-reports:
    delete:
      operationId: fingerprinter.entrypoints.api.handlers.delete_all_fingerprintings
      description: Delete all fingerprinting reports.
      responses:
        200:
          description: Fingerprinting reports successfully deleted.
        5XX:
          description: Unexpected Error.
  /tasks/active:
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_active_tasks
      description: Get status of a task
      responses:
        200:
          description: Task status description succesfully retreived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"

  /tasks/{task_id}:
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_task_status
      description: Get status of a task
      parameters:
        - name: task_id
          in: path
          required: true
          description: task id
          schema:
            type: string
      responses:
        200:
          description: Task status description succesfully retreived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
    delete:
      operationId: fingerprinter.entrypoints.api.handlers.stop_running_task
      description: cancel execution  status of a task
      parameters:
        - name: task_id
          in: path
          required: true
          description: task id
          schema:
            type: string
      responses:
        200:
          description: Task accepted for revoking.
        406:
          description: Task already marked for revoking.