openapi: 3.0.1

info:
  title: Fingerprinting Service
  description: |
    This API provides the possibility to fingerprint an RDF file or SPARQL endpoint.
    A fingerprinting runs as a job: starting one answers `202` with the job id, and the job record
    (`/reports/{uid}` or `/tasks/{task_id}`) tells its state, the reason it failed and the
    measurements that failed.

  contact:
    name: Eugeniu Costetchi
    url: http://costezki.ro
    email: costezki.eugen@gmail.com
  license:
    name: GNU General Public License Version 3 (GPLv3)
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 2.0.0

servers:
  - url: 'http://localhost:4020/'
    description: Default server

components:
  schemas:
    EndpointFingerprinter:
      type: object
      description: Fingerprint a SPARQL endpoint
      properties:
        sparql_endpoint_url:
          type: string
          description: The endpoint to fingerprint
        graphs:
          type: array
          description: An optional list of named graphs to restrict the scope of the fingerprinting
          items:
            type: string
      required:
        - sparql_endpoint_url

    FileFingerprinter:
      type: object
      description: Fingerprint a file
      properties:
        data_file:
          type: string
          format: binary
          description: The file to be fingerprinted
      required:
        - data_file

    JobState:
      type: string
      enum: [queued, running, completed, completed_with_failures, failed, cancelled]

    ReportFormat:
      type: string
      enum: [html, json, shacl, puml, pattern, shex, pitfalls, zip]

    JobCreated:
      type: object
      properties:
        task_id:
          type: string
          description: The job id; it names the job's report and its task.
      required:
        - task_id

    JobRecord:
      type: object
      description: A fingerprinting job.
      properties:
        id:
          type: string
        source:
          type: object
          description: The endpoint or the uploaded file name, and the named graphs.
          properties:
            endpoint:
              type: string
            file:
              type: string
            graphs:
              type: array
              items:
                type: string
        created_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/JobState'
        reason:
          type: string
          nullable: true
          description: Why the job failed.
        failures:
          type: array
          description: The measurements that failed.
          items:
            type: string
        formats:
          type: array
          description: The formats that can be downloaded.
          items:
            $ref: '#/components/schemas/ReportFormat'
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the job reached a final state; null while it is queued or running.
        files:
          type: object
          description: The names of the files of each format, so that one can be downloaded by name.
          additionalProperties:
            type: array
            items:
              type: string

    TaskStatus:
      type: object
      description: The state of a job.
      properties:
        task_id:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        reason:
          type: string
          nullable: true
        failures:
          type: array
          items:
            type: string

    Message:
      type: object
      properties:
        message:
          type: string

    Problem:
      type: object
      description: A problem response (RFC 9457).
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  parameters:
    uid:
      name: uid
      in: path
      required: true
      description: The job id.
      schema:
        type: string
        # Connexion 3 does not check format: uuid on path values, so a pattern states it
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    taskId:
      name: task_id
      in: path
      required: true
      description: The job id.
      schema:
        type: string
        # Connexion 3 does not check format: uuid on path values, so a pattern states it
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  # Error responses are problem+json (RFC 9457) with the shape of the Problem schema; they declare no
  # content here, since Connexion cannot pick one content type for an operation that lists several.
  responses:
    BadRequest:
      description: The request is invalid.
    NotFound:
      description: No such job or report, or the report has no file of this format.
    Conflict:
      description: >-
        The job is in the wrong state: it is not queued or running (cancel), or it still is
        (delete).
    UnsupportedMediaType:
      description: The file type is not supported; the problem lists the accepted types.
    PayloadTooLarge:
      description: The file is larger than the upload limit.
    Unavailable:
      description: The job queue is unavailable.

paths:
  /fingerprint-sparql-endpoint:
    post:
      operationId: fingerprinter.entrypoints.api.handlers.fingerprint_sparql_endpoint
      description: Start a job that fingerprints a SPARQL endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointFingerprinter'
      responses:
        202:
          description: The job is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        400:
          $ref: '#/components/responses/BadRequest'
        503:
          $ref: '#/components/responses/Unavailable'
  /fingerprint-file:
    post:
      operationId: fingerprinter.entrypoints.api.handlers.fingerprint_file
      description: Start a job that fingerprints an RDF file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileFingerprinter'
      responses:
        202:
          description: The job is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        503:
          $ref: '#/components/responses/Unavailable'

  /reports:
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_fingerprintings
      description: List the job records.
      responses:
        200:
          description: The job records, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRecord'
  /reports/{uid}:
    parameters:
      - $ref: '#/components/parameters/uid'
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_fingerprinting
      description: Get a job record.
      responses:
        200:
          description: The job record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRecord'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: fingerprinter.entrypoints.api.handlers.delete_fingerprinting
      description: Delete a job and its report.
      responses:
        200:
          description: The report is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
  /reports/{uid}/{format}:
    parameters:
      - $ref: '#/components/parameters/uid'
      - name: format
        in: path
        required: true
        description: The format to download; a format of several files comes as a zip.
        schema:
          $ref: '#/components/schemas/ReportFormat'
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_report_file
      description: Download a report in one format.
      responses:
        200:
          description: The file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
  /reports/{uid}/{format}/{file}:
    parameters:
      - $ref: '#/components/parameters/uid'
      - name: format
        in: path
        required: true
        description: The format the file belongs to.
        schema:
          $ref: '#/components/schemas/ReportFormat'
      - name: file
        in: path
        required: true
        description: A file name the job record lists under this format.
        schema:
          type: string
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_report_named_file
      description: Download one file of a format.
      responses:
        200:
          description: The file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
  /remove-reports:
    delete:
      operationId: fingerprinter.entrypoints.api.handlers.delete_all_fingerprintings
      description: Delete every job and report; there may be none.
      responses:
        200:
          description: The reports are deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /tasks/active:
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_active_tasks
      description: List the jobs that are queued or running.
      responses:
        200:
          description: The job records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRecord'
  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/taskId'
    get:
      operationId: fingerprinter.entrypoints.api.handlers.get_task_status
      description: Get the state of a job.
      responses:
        200:
          description: The state, the reason it failed and the failed measurements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatus'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: fingerprinter.entrypoints.api.handlers.stop_running_task
      description: Cancel a queued or running job.
      responses:
        200:
          description: The job is cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
