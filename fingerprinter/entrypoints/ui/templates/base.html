{% import "icons.html" as icons %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {# htmx must not inject its own <style> or evaluate code #}
    <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
    <title>{% block title %}Jobs{% endblock %} · RDF Fingerprinter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}" defer></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
    <div class="bar">
        <a class="brand" href="{{ url_for('index') }}">{{ icons.logo() }} RDF Fingerprinter</a>
        <nav class="nav" aria-label="Main">
            <a href="{{ url_for('index') }}"{% if active_page|default('index') == 'index' %} aria-current="page"{% endif %}>Jobs</a>
            {# stage 1 replaces this target with the New job page (task 1.4) #}
            <a class="btn btn-primary" href="{{ url_for('fingerprint_sparql_endpoint') }}">{{ icons.plus() }} New job</a>
        </nav>
    </div>
</header>
<div id="announce" class="visually-hidden" aria-live="polite"></div>
<main id="content">
    <div id="flashes">
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash flash-{{ 'error' if category == FLASH_ERROR else 'success' }}"
                 role="{{ 'alert' if category == FLASH_ERROR else 'status' }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% block app_content %}{% endblock %}
</main>
<footer class="site-footer">Powered by <a href="https://github.com/meaningfy-ws">Meaningfy</a></footer>
</body>
</html>
