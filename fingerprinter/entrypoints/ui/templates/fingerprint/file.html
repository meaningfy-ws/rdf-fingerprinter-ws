{% extends "base.html" %}
{% import "macros.html" as macros %}
{% set active_page = "fingerprint_file" %}

{% block app_content %}
    <h1 id="title">{{ title }}</h1>

    <form class="card" method="POST" enctype="multipart/form-data" role="form" action="">

        {{ form.csrf_token }}
        {{ macros.render_upload_input_field(form.data_file) }}

        <div class="form-actions">
            <button type="submit" id="submit" class="btn btn-primary">{{ title }}</button>
            <a href="{{ url_for('fingerprint_sparql_endpoint') }}" id="reload" class="btn">Reset form</a>
        </div>
    </form>
{% endblock %}
