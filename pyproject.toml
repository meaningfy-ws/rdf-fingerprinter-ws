# Minimal pyproject.toml — Meaningfy standard (no-src, config-in-root).
# Only [project], [dependency-groups], [tool.uv*] and [build-system] live here; every tool is
# configured in its own root file (ruff.toml, mypy.ini, pytest.ini, .coveragerc, .importlinter).

[project]
name = "rdf-fingerprinter-ws"
version = "0.1.0"
description = "Web service and UI that fingerprint RDF datasets with the rdf-fingerprinter library"
authors = [{ name = "Meaningfy", email = "hi@meaningfy.ws" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.15"
dependencies = [
    # Exact pins: the latest releases on 2026-11-08 (D-10).
    "rdf-fingerprinter==3.5.0",
    "flask==3.1.3",
    "flask-wtf==1.3.0",
    "connexion[flask,swagger-ui,uvicorn]==3.3.0",
    "celery[redis]==5.7.0",
    "flower==2.2.0",
    "requests==2.34.2",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = ["pre-commit==4.7.0"]
test = [
    "pytest==9.2.0",
    "pytest-bdd==9.0.1",
    "pytest-cov==7.1.0",
    "testcontainers==4.15.0",
    "beautifulsoup4==4.15.0",
]
lint = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "import-linter==2.16",
    "types-requests==2.33.0.20261030",
    "types-wtforms==3.3.0.20261104",
]

[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.uv.build-backend]
module-name = "fingerprinter"
module-root = ""

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"
